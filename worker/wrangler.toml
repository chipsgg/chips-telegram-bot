name = "chips-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# PRODUCTION (top level): `wrangler deploy`
#   bot.chips.gg, prod secrets (Discord app 901908108136308757 "Chips.gg VIP Assistant",
#   Telegram @chipsgg_official_bot, Chips operator token). Never point test scripts here.
routes = [
  { pattern = "bot.chips.gg", custom_domain = true }
]

# scheduled(): every minute -> uptime watchdog; 04:17 UTC daily -> VIP rank/role sync
[triggers]
crons = ["* * * * *", "17 4 * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

[vars]
# VERSION / COMMIT / BUILT_AT are stamped at deploy time by scripts/deploy.js (--var); these are fallbacks
VERSION = "unstamped"
COMMIT = "unknown"
BUILT_AT = ""
# the only guild where /linkaccount may assign VIP rank roles (Chips Casino)
DISCORD_ROLES_GUILD_ID = "541035273547415552"
# public handle, used to detect @mentions in groups
TELEGRAM_BOT_USERNAME = "chipsgg_official_bot"
# uptime watchdog (cron below): probes PUBLIC_HOST/health, one Telegram message per up/down transition
PUBLIC_HOST = "bot.chips.gg"
ALERT_TELEGRAM_CHAT = "147051786"
# proactive big-win posts; empty = off. Set to channel ids / chat ids once marketing picks them.
BROADCAST_DISCORD_CHANNELS = ""
BROADCAST_TELEGRAM_CHATS = ""
BROADCAST_MIN_USD = "1000"
BROADCAST_MIN_MULTIPLIER = "500"
CHIPS_API_HOST = "https://api.chips.gg/prod/api"
ENVIRONMENT = "production"

# Secrets per environment (`wrangler secret put <NAME>` / `wrangler secret put <NAME> --env dev`):
#   CHIPS_TOKEN               operator token (staff commands + /affiliate); optional for public-only
#   DISCORD_PUBLIC_KEY        from GET /applications/@me (verify_key)
#   DISCORD_APPLICATION_ID
#   DISCORD_TOKEN             bot token (role assignment + command registration)
#   TELEGRAM_TOKEN            bot token
#   TELEGRAM_WEBHOOK_SECRET   random string, passed to setWebhook as secret_token

[[durable_objects.bindings]]
name = "CHIPS_FEED"
class_name = "ChipsFeed"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChipsFeed"]

[[d1_databases]]
binding = "DB"
database_name = "chips-bot-metrics"
database_id = "6f8f9eb1-f9f7-4678-833a-a8a6aa40be79"
migrations_dir = "migrations"

[observability]
enabled = true

# DEV / STAGING: `wrangler deploy --env dev`
#   bot-cf.chips.gg, dev secrets only (devbot 1326290512675606548, @chipsgg_dev_bot).
#   Own D1 + own Durable Object namespace. All smoke/e2e runs target THIS.
[env.dev]
name = "chips-bot-dev"
workers_dev = true
routes = [
  { pattern = "bot-cf.chips.gg", custom_domain = true }
]

[env.dev.triggers]
crons = ["* * * * *", "17 4 * * *"]

[env.dev.vars]
VERSION = "unstamped-dev"
COMMIT = "unknown"
BUILT_AT = ""
# devbot is in no guild; set to a test server id when testing role assignment
DISCORD_ROLES_GUILD_ID = ""
TELEGRAM_BOT_USERNAME = "chipsgg_dev_bot"
PUBLIC_HOST = "bot-cf.chips.gg"
ALERT_TELEGRAM_CHAT = "147051786"
BROADCAST_DISCORD_CHANNELS = "1550642665006170153"
BROADCAST_TELEGRAM_CHATS = "147051786"
BROADCAST_MIN_USD = "300"
BROADCAST_MIN_MULTIPLIER = "500"
CHIPS_API_HOST = "https://api.chips.gg/prod/api"
ENVIRONMENT = "dev"

[env.dev.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

[[env.dev.durable_objects.bindings]]
name = "CHIPS_FEED"
class_name = "ChipsFeed"

[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["ChipsFeed"]

[[env.dev.d1_databases]]
binding = "DB"
database_name = "chips-bot-metrics-dev"
database_id = "3c834ab5-355a-487b-8c96-069e03ba5411"
migrations_dir = "migrations"

[env.dev.observability]
enabled = true
