name: Release

# A `vX.Y.Z` tag = a production release. `npm run release -- <patch|minor|major>` cuts one.
# Lint + tests, GitHub Release with generated notes, then deploys production with the tag
# stamped into /health (version, commit, builtAt) and verifies the edge serves that version.
#
# Credentials: repo secret CLOUDFLARE_API_TOKEN (account token scoped to REDPKT:
# Workers Scripts:Edit, D1:Edit, Account Settings:Read) + repo variable CLOUDFLARE_ACCOUNT_ID.
# Set Sep 16 2026. If the secret is ever removed the deploy step fails loudly; deploy by hand
# with `cd worker && npm run deploy`.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bot.chips.gg/health
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: resolve version
        id: v
        run: |
          node scripts/version.js
          echo "version=$(node -e 'import("./scripts/version.js").then(m=>console.log(m.resolveVersion().version))')" >> "$GITHUB_OUTPUT"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag || echo "release already exists"

      - name: check deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret / CLOUDFLARE_ACCOUNT_ID variable missing; deploy ${{ steps.v.outputs.version }} by hand: cd worker && npm run deploy"
            exit 1
          fi

      - name: deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply chips-bot-metrics --remote
          node scripts/deploy.js

      - name: summary
        run: |
          {
            echo "## Released ${{ steps.v.outputs.version }}"
            echo
            echo '```json'
            curl -s "https://bot.chips.gg/health?fresh"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
