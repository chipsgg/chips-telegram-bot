name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  worker:
    name: worker tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, so version.js resolves
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: build version
        run: node scripts/version.js
      - name: wrangler dry-run (compiles the worker, no upload)
        run: npx wrangler deploy --dry-run --outdir dist
